<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Analytics · Ashish Jha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fbfaf8; --surface: #ffffff; --text: #1c1b1a; --muted: #6b6660;
      --faint: #908a82; --accent: #9a3b2e; --accent-soft: #f3e7e3; --border: #e7e3dc;
      --shadow: 0 1px 2px rgba(28,27,26,.04), 0 8px 24px rgba(28,27,26,.05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16140f; --surface: #1f1d17; --text: #ece8e1; --muted: #a9a299;
        --faint: #837c72; --accent: #e89a85; --accent-soft: #2c2018; --border: #2c2a23;
        --shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.25);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 64px 24px 96px; }
    h1 {
      font-family: "Newsreader", Georgia, serif; font-weight: 600;
      font-size: 2rem; letter-spacing: -0.01em; margin: 0 0 4px;
    }
    .sub { color: var(--muted); margin: 0 0 36px; font-size: 0.98rem; }
    h2 {
      font-size: 0.8rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.14em; color: var(--faint); margin: 40px 0 16px;
    }
    a { color: var(--accent); }

    /* Login */
    .login { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    input[type=password] {
      flex: 1; min-width: 200px; font: inherit; font-size: 0.95rem;
      padding: 10px 13px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface); color: var(--text);
    }
    button {
      font: inherit; font-weight: 600; font-size: 0.92rem; cursor: pointer;
      padding: 10px 18px; border: 0; border-radius: 10px;
      background: var(--accent); color: #fff;
    }
    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .msg { color: var(--accent); font-size: 0.9rem; margin: 12px 0 0; min-height: 1.2em; }

    /* Stat cards */
    .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .stat {
      padding: 18px 20px; border: 1px solid var(--border); border-radius: 14px;
      background: var(--surface); box-shadow: var(--shadow);
    }
    .stat .n {
      font-family: "Newsreader", serif; font-weight: 600;
      font-size: 2.4rem; line-height: 1; color: var(--accent);
    }
    .stat .l {
      font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--faint); margin-top: 8px; font-weight: 600;
    }

    /* Click breakdown */
    .row { margin-bottom: 12px; }
    .row .head { display: flex; justify-content: space-between; gap: 16px; font-size: 0.92rem; margin-bottom: 5px; }
    .row .label { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .val { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; flex-shrink: 0; }
    .bar { height: 8px; border-radius: 6px; background: var(--accent-soft); overflow: hidden; }
    .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
    .empty { color: var(--faint); font-size: 0.95rem; }
    .hidden { display: none; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 40px; }
    .toolbar .meta { color: var(--faint); font-size: 0.82rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Analytics</h1>
    <p class="sub">Private dashboard · profile views and link clicks</p>

    <!-- ============ CONFIG: paste your deployed Vercel URL ============ -->
    <script>
      // e.g. "https://portfolio-api.vercel.app"
      window.ANALYTICS_ENDPOINT = "https://YOUR-PROJECT.vercel.app";
    </script>

    <!-- Login -->
    <div id="login">
      <div class="login">
        <input id="token" type="password" placeholder="Admin token" autocomplete="current-password" />
        <button id="go">View stats</button>
      </div>
      <p id="msg" class="msg"></p>
    </div>

    <!-- Dashboard -->
    <div id="dash" class="hidden">
      <div class="cards" id="cards"></div>

      <h2>Link clicks</h2>
      <div id="clicks"></div>

      <div class="toolbar">
        <span class="meta" id="meta"></span>
        <button class="ghost" id="logout">Sign out</button>
      </div>
    </div>
  </div>

  <script>
    var endpoint = (window.ANALYTICS_ENDPOINT || "").replace(/\/$/, "");
    var $ = function (id) { return document.getElementById(id); };

    function show(view) {
      $("login").classList.toggle("hidden", view !== "login");
      $("dash").classList.toggle("hidden", view !== "dash");
    }

    function esc(s) {
      return String(s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }

    function render(data) {
      var views = data.view || 0;

      // Collect click:* keys
      var clicks = [];
      var totalClicks = 0;
      Object.keys(data).forEach(function (k) {
        if (k.indexOf("click:") === 0) {
          var n = data[k];
          totalClicks += n;
          clicks.push({ label: k.slice(6), n: n });
        }
      });
      clicks.sort(function (a, b) { return b.n - a.n; });

      $("cards").innerHTML =
        '<div class="stat"><div class="n">' + views + '</div><div class="l">Profile views</div></div>' +
        '<div class="stat"><div class="n">' + totalClicks + '</div><div class="l">Total link clicks</div></div>';

      if (!clicks.length) {
        $("clicks").innerHTML = '<p class="empty">No link clicks recorded yet.</p>';
      } else {
        var max = clicks[0].n || 1;
        $("clicks").innerHTML = clicks.map(function (c) {
          var pct = Math.round((c.n / max) * 100);
          return (
            '<div class="row">' +
              '<div class="head"><span class="label">' + esc(c.label) + '</span>' +
              '<span class="val">' + c.n + '</span></div>' +
              '<div class="bar"><span style="width:' + pct + '%"></span></div>' +
            '</div>'
          );
        }).join("");
      }

      $("meta").textContent = "Updated " + new Date().toLocaleString();
    }

    function load(token) {
      $("msg").textContent = "Loading…";
      if (!endpoint || endpoint.indexOf("YOUR-PROJECT") !== -1) {
        $("msg").textContent = "Set ANALYTICS_ENDPOINT in this file to your Vercel URL first.";
        return;
      }
      fetch(endpoint + "/api/stats", { headers: { "X-Admin-Token": token } })
        .then(function (r) {
          if (r.status === 401) throw new Error("Wrong token.");
          if (!r.ok) throw new Error("Request failed (" + r.status + ").");
          return r.json();
        })
        .then(function (data) {
          sessionStorage.setItem("admin_token", token);
          $("msg").textContent = "";
          show("dash");
          render(data);
        })
        .catch(function (e) {
          $("msg").textContent = e.message || "Could not load stats.";
          show("login");
        });
    }

    $("go").addEventListener("click", function () { load($("token").value.trim()); });
    $("token").addEventListener("keydown", function (e) { if (e.key === "Enter") load($("token").value.trim()); });
    $("logout").addEventListener("click", function () {
      sessionStorage.removeItem("admin_token");
      $("token").value = "";
      show("login");
    });

    // Auto-load if a token is already in this session.
    var saved = sessionStorage.getItem("admin_token");
    if (saved) load(saved); else show("login");
  </script>
</body>
</html>
