<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Analytics · Ashish Jha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fbfaf8; --surface: #ffffff; --text: #1c1b1a; --muted: #6b6660;
      --faint: #908a82; --accent: #9a3b2e; --accent-soft: #f3e7e3; --border: #e7e3dc;
      --shadow: 0 1px 2px rgba(28,27,26,.04), 0 8px 24px rgba(28,27,26,.05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16140f; --surface: #1f1d17; --text: #ece8e1; --muted: #a9a299;
        --faint: #837c72; --accent: #e89a85; --accent-soft: #2c2018; --border: #2c2a23;
        --shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.25);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 64px 24px 96px; }
    h1 {
      font-family: "Newsreader", Georgia, serif; font-weight: 600;
      font-size: 2rem; letter-spacing: -0.01em; margin: 0 0 4px;
    }
    .sub { color: var(--muted); margin: 0 0 36px; font-size: 0.98rem; }
    h2 {
      font-size: 0.8rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.14em; color: var(--faint); margin: 44px 0 16px;
    }
    a { color: var(--accent); }

    /* Login */
    .login { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    input[type=password] {
      flex: 1; min-width: 200px; font: inherit; font-size: 0.95rem;
      padding: 10px 13px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface); color: var(--text);
    }
    button {
      font: inherit; font-weight: 600; font-size: 0.92rem; cursor: pointer;
      padding: 10px 18px; border: 0; border-radius: 10px;
      background: var(--accent); color: #fff;
    }
    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .msg { color: var(--accent); font-size: 0.9rem; margin: 12px 0 0; min-height: 1.2em; }

    /* Stat cards */
    .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .stat {
      padding: 18px 20px; border: 1px solid var(--border); border-radius: 14px;
      background: var(--surface); box-shadow: var(--shadow);
    }
    .stat .n {
      font-family: "Newsreader", serif; font-weight: 600;
      font-size: 2.4rem; line-height: 1; color: var(--accent);
    }
    .stat .l {
      font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--faint); margin-top: 8px; font-weight: 600;
    }

    /* Horizontal bar rows (link clicks) */
    .row { margin-bottom: 12px; }
    .row .head { display: flex; justify-content: space-between; gap: 16px; font-size: 0.92rem; margin-bottom: 5px; }
    .row .label { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .val { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; flex-shrink: 0; }
    .bar { height: 8px; border-radius: 6px; background: var(--accent-soft); overflow: hidden; }
    .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 6px; }

    /* Daily column chart */
    .chart {
      display: flex; align-items: flex-end; gap: 6px;
      height: 160px; padding: 12px 14px;
      border: 1px solid var(--border); border-radius: 14px;
      background: var(--surface); box-shadow: var(--shadow); overflow-x: auto;
    }
    .col { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; min-width: 26px; }
    .col .stack { width: 100%; display: flex; flex-direction: column; justify-content: flex-end; height: 110px; }
    .col .vbar { width: 70%; margin: 0 auto; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
    .col .vbar.clicks { background: var(--accent-soft); }
    .col .d { font-size: 0.66rem; color: var(--faint); white-space: nowrap; }
    .col .c { font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }
    .legend { display: flex; gap: 16px; margin: 10px 2px 0; font-size: 0.78rem; color: var(--muted); }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
    .legend i.v { background: var(--accent); }
    .legend i.c { background: var(--accent-soft); border: 1px solid var(--border); }

    /* Activity feed */
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); font-weight: 600; }
    td.what { white-space: normal; }
    td .tag { color: var(--accent); font-weight: 600; }
    .feed-wrap { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); overflow: auto; max-height: 460px; }
    td .muted { color: var(--faint); }

    .empty { color: var(--faint); font-size: 0.95rem; }
    .hidden { display: none; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 40px; }
    .toolbar .meta { color: var(--faint); font-size: 0.82rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Analytics</h1>
    <p class="sub">Private dashboard · views, link clicks, and recent activity</p>

    <!-- ============ CONFIG: paste your deployed Vercel URL ============ -->
    <script>
      // e.g. "https://portfolio-api.vercel.app"
      window.ANALYTICS_ENDPOINT = "https://YOUR-PROJECT.vercel.app";
    </script>

    <!-- Login -->
    <div id="login">
      <div class="login">
        <input id="token" type="password" placeholder="Admin token" autocomplete="current-password" />
        <button id="go">View stats</button>
      </div>
      <p id="msg" class="msg"></p>
    </div>

    <!-- Dashboard -->
    <div id="dash" class="hidden">
      <div class="cards" id="cards"></div>

      <h2>Views by day</h2>
      <div class="chart" id="chart"></div>
      <div class="legend"><span><i class="v"></i>Views</span><span><i class="c"></i>Clicks</span></div>

      <h2>Link clicks</h2>
      <div id="clicks"></div>

      <h2>Recent activity</h2>
      <div class="feed-wrap">
        <table id="feed">
          <thead>
            <tr><th>When (local)</th><th>Event</th><th>Location</th><th>Source</th><th>Device</th></tr>
          </thead>
          <tbody id="feedbody"></tbody>
        </table>
      </div>

      <div class="toolbar">
        <span class="meta" id="meta"></span>
        <button class="ghost" id="logout">Sign out</button>
      </div>
    </div>
  </div>

  <script>
    var endpoint = (window.ANALYTICS_ENDPOINT || "").replace(/\/$/, "");
    var $ = function (id) { return document.getElementById(id); };

    function show(view) {
      $("login").classList.toggle("hidden", view !== "login");
      $("dash").classList.toggle("hidden", view !== "dash");
    }

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }

    function flag(cc) {
      if (!cc || cc.length !== 2 || cc === "??") return "";
      var base = 0x1f1e6;
      return String.fromCodePoint(base + cc.charCodeAt(0) - 65) +
             String.fromCodePoint(base + cc.charCodeAt(1) - 65) + " ";
    }

    function render(data) {
      var totals = data.totals || { views: 0, clicks: 0 };

      // ---- summary cards ----
      $("cards").innerHTML =
        '<div class="stat"><div class="n">' + (totals.views || 0) + '</div><div class="l">Profile views</div></div>' +
        '<div class="stat"><div class="n">' + (totals.clicks || 0) + '</div><div class="l">Total link clicks</div></div>';

      // ---- views by day (last 30 days present) ----
      var daily = data.daily || {};
      var days = Object.keys(daily).sort().slice(-30);
      if (!days.length) {
        $("chart").innerHTML = '<p class="empty">No daily data yet.</p>';
      } else {
        var maxDay = 1;
        days.forEach(function (d) { maxDay = Math.max(maxDay, daily[d].views || 0, daily[d].clicks || 0); });
        $("chart").innerHTML = days.map(function (d) {
          var v = daily[d].views || 0, c = daily[d].clicks || 0;
          var vh = Math.round((v / maxDay) * 100);
          var ch = Math.round((c / maxDay) * 100);
          var md = d.slice(5); // MM-DD
          return (
            '<div class="col" title="' + d + ' — ' + v + ' views, ' + c + ' clicks">' +
              '<span class="c">' + v + '</span>' +
              '<div class="stack">' +
                '<div class="vbar" style="height:' + vh + '%"></div>' +
                '<div class="vbar clicks" style="height:' + ch + '%"></div>' +
              '</div>' +
              '<span class="d">' + md + '</span>' +
            '</div>'
          );
        }).join("");
      }

      // ---- link clicks ----
      var byLabel = data.clicksByLabel || {};
      var clicks = Object.keys(byLabel).map(function (k) { return { label: k, n: byLabel[k] }; });
      clicks.sort(function (a, b) { return b.n - a.n; });
      if (!clicks.length) {
        $("clicks").innerHTML = '<p class="empty">No link clicks recorded yet.</p>';
      } else {
        var maxC = clicks[0].n || 1;
        $("clicks").innerHTML = clicks.map(function (c) {
          var pct = Math.round((c.n / maxC) * 100);
          return (
            '<div class="row">' +
              '<div class="head"><span class="label">' + esc(c.label) + '</span>' +
              '<span class="val">' + c.n + '</span></div>' +
              '<div class="bar"><span style="width:' + pct + '%"></span></div>' +
            '</div>'
          );
        }).join("");
      }

      // ---- recent activity feed ----
      var events = data.events || [];
      if (!events.length) {
        $("feedbody").innerHTML = '<tr><td colspan="5" class="empty" style="padding:16px">No activity recorded yet.</td></tr>';
      } else {
        $("feedbody").innerHTML = events.map(function (e) {
          var when = e.t ? new Date(e.t).toLocaleString() : "";
          var what = e.type === "click"
            ? '<span class="tag">Click</span> ' + esc(e.label || "(link)")
            : '<span class="tag">View</span>';
          var loc = (flag(e.country) + (e.city ? esc(e.city) : (e.country && e.country !== "?" ? esc(e.country) : "—"))).trim() || "—";
          var src = e.ref && e.ref !== "direct" ? esc(e.ref) : '<span class="muted">direct</span>';
          var dev = esc((e.device || "") + (e.browser ? " · " + e.browser : ""));
          return (
            '<tr>' +
              '<td class="muted">' + esc(when) + '</td>' +
              '<td class="what">' + what + '</td>' +
              '<td>' + loc + '</td>' +
              '<td>' + src + '</td>' +
              '<td class="muted">' + dev + '</td>' +
            '</tr>'
          );
        }).join("");
      }

      $("meta").textContent = "Updated " + new Date().toLocaleString();
    }

    function load(token) {
      $("msg").textContent = "Loading…";
      if (!endpoint || endpoint.indexOf("YOUR-PROJECT") !== -1) {
        $("msg").textContent = "Set ANALYTICS_ENDPOINT in this file to your Vercel URL first.";
        return;
      }
      fetch(endpoint + "/api/stats", { headers: { "X-Admin-Token": token } })
        .then(function (r) {
          if (r.status === 401) throw new Error("Wrong token.");
          if (!r.ok) throw new Error("Request failed (" + r.status + ").");
          return r.json();
        })
        .then(function (data) {
          sessionStorage.setItem("admin_token", token);
          $("msg").textContent = "";
          show("dash");
          render(data);
        })
        .catch(function (e) {
          $("msg").textContent = e.message || "Could not load stats.";
          show("login");
        });
    }

    $("go").addEventListener("click", function () { load($("token").value.trim()); });
    $("token").addEventListener("keydown", function (e) { if (e.key === "Enter") load($("token").value.trim()); });
    $("logout").addEventListener("click", function () {
      sessionStorage.removeItem("admin_token");
      $("token").value = "";
      show("login");
    });

    // Auto-load if a token is already in this session.
    var saved = sessionStorage.getItem("admin_token");
    if (saved) load(saved); else show("login");
  </script>
</body>
</html>
