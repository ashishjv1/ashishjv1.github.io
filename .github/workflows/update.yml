name: Update feeds

# Refreshes the Videos (YouTube) and Writing (Substack) lists in index.html
# from their RSS feeds, then commits any change. The site stays static.

on:
  schedule:
    - cron: "0 6 * * *"     # daily at 06:00 UTC
  workflow_dispatch: {}      # lets you run it on demand from the Actions tab

permissions:
  contents: write            # needed to commit the refreshed index.html

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh feeds
        run: python update.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain index.html)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Auto-update feeds"
            git push
          else
            echo "No changes."
          fi
